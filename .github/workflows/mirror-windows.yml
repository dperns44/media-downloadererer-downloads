name: Copy verified Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-windows.yml'
permissions:
  contents: write
jobs:
  copy-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy and verify the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v1.8.0-beta.4'
          installer='Media-Downloaderererer-1.8.0-beta.4-Setup.exe'
          curl --fail --location --retry 3 --output "$installer" "https://github.com/dperns44/buck-uber-downloadererer/releases/download/$tag/$installer"
          printf '%s  %s\n' 'ca5616f283513fbb3a7d22dc0c70c3053cf86378ae82cc158894b86ae7a62203' "$installer" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create "$tag" "$installer" SHA256SUMS.txt --title 'Media Downloaderererer 1.8.0-beta.4 (Windows)' --notes-file RELEASE-NOTES.md --prerelease
          fi
